<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEX - Oficina de Abogados</title>
    <script>
        // Apply theme immediately before rendering to prevent white flash
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Dark Mode overrides for custom background styles */
        [data-bs-theme="dark"] body {
            background-color: #121212 !important;
            color: #f8f9fa !important;
        }
        [data-bs-theme="dark"] main {
            background-color: #121212 !important;
        }
        [data-bs-theme="dark"] .card {
            background-color: #1e1e1e !important;
            color: #f8f9fa !important;
            border-color: #2d2d2d !important;
        }
        [data-bs-theme="dark"] .bg-white {
            background-color: #1e1e1e !important;
        }
        [data-bs-theme="dark"] .bg-light {
            background-color: #2b2b2b !important;
        }
        [data-bs-theme="dark"] .text-dark {
            color: #f8f9fa !important;
        }
        [data-bs-theme="dark"] .text-secondary {
            color: #adb5bd !important;
        }
        [data-bs-theme="dark"] .border {
            border-color: #2d2d2d !important;
        }
        [data-bs-theme="dark"] input, 
        [data-bs-theme="dark"] select, 
        [data-bs-theme="dark"] textarea {
            background-color: #2b2b2b !important;
            color: #ffffff !important;
            border-color: #444444 !important;
        }
        [data-bs-theme="dark"] input::placeholder {
            color: #6c757d !important;
        }
        [data-bs-theme="dark"] .table {
            color: #f8f9fa !important;
        }
        [data-bs-theme="dark"] .table-light {
            background-color: #2d2d2d !important;
            color: #ffffff !important;
        }
        [data-bs-theme="dark"] .table th, 
        [data-bs-theme="dark"] .table td {
            border-color: #2d2d2d !important;
        }
        [data-bs-theme="dark"] .modal-content {
            background-color: #1e1e1e !important;
            border-color: #2d2d2d !important;
        }
        [data-bs-theme="dark"] h1,
        [data-bs-theme="dark"] h2,
        [data-bs-theme="dark"] h3,
        [data-bs-theme="dark"] h4,
        [data-bs-theme="dark"] h5,
        [data-bs-theme="dark"] h6,
        [data-bs-theme="dark"] .card-title {
            color: #ffffff !important;
        }
        [data-bs-theme="dark"] .active-sigex {
            color: #00409A !important;
            background-color: #ffffff !important;
        }
        [data-bs-theme="dark"] .active-sigex i {
            color: #00409A !important;
        }
        [data-bs-theme="dark"] .list-group-item {
            background-color: #1e1e1e !important;
            color: #f8f9fa !important;
            border-color: #2d2d2d !important;
        }
        [data-bs-theme="dark"] .list-group-item-action {
            color: #f8f9fa !important;
        }
        [data-bs-theme="dark"] .list-group-item-action:hover {
            background-color: #2b2b2b !important;
            color: #ffffff !important;
        }
        [data-bs-theme="dark"] .list-group-item.active {
            background-color: #00409A !important;
            border-color: #00409A !important;
            color: white !important;
        }
        [data-bs-theme="dark"] .list-group-item.active i {
            color: white !important;
        }
        /* Estilos premium para pestañas (tabs) */
        .nav-tabs {
            border-bottom: 1px solid #dee2e6;
        }
        .nav-tabs .nav-link {
            color: #6c757d !important;
            border: none !important;
            border-bottom: 2px solid transparent !important;
            background-color: transparent !important;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .nav-tabs .nav-link:hover {
            color: #0d6efd !important;
            border-bottom-color: #dee2e6 !important;
        }
        .nav-tabs .nav-link.active {
            color: #0d6efd !important;
            border-bottom: 2px solid #0d6efd !important;
            font-weight: 600 !important;
        }

        /* Estilos claros y visibles para botones .btn-white */
        .btn-white {
            background-color: #ffffff !important;
            color: #333333 !important;
            border: 1px solid #dee2e6 !important;
        }
        .btn-white:hover {
            background-color: #f8f9fa !important;
            color: #212529 !important;
            border-color: #c1c9d0 !important;
        }
        .btn-white.text-danger {
            color: #dc3545 !important;
            border-color: #f5c2c7 !important;
        }
        .btn-white.text-danger:hover {
            background-color: #ea868f !important;
            color: #ffffff !important;
            border-color: #dc3545 !important;
        }
        .btn-white.text-success {
            color: #198754 !important;
            border-color: #badbcc !important;
        }
        .btn-white.text-success:hover {
            background-color: #75b798 !important;
            color: #ffffff !important;
            border-color: #198754 !important;
        }
        .btn-white.text-warning {
            color: #ffc107 !important;
            border-color: #ffecb5 !important;
        }
        .btn-white.text-warning:hover {
            background-color: #ffda6a !important;
            color: #212529 !important;
            border-color: #ffc107 !important;
        }
        .btn-white.text-secondary {
            color: #6c757d !important;
            border-color: #dee2e6 !important;
        }
        .btn-white.text-secondary:hover {
            background-color: #e2e3e5 !important;
            color: #212529 !important;
        }
        .btn-white:disabled, .btn-white.disabled {
            background-color: #f8f9fa !important;
            color: #bcbcbc !important;
            border-color: #e9ecef !important;
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Panel de detalles con scrollbar interno para evitar corte de contenido/botones */
        #detailsPanel {
            max-height: calc(100vh - 50px) !important;
            overflow-y: auto !important;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0 d-flex min-vh-100">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Intercept form submissions that require confirmation
        document.addEventListener('submit', function(e) {
            const form = e.target;
            if (form.hasAttribute('data-confirm')) {
                e.preventDefault();
                const message = form.getAttribute('data-confirm');
                Swal.fire({
                    title: '¿Confirmar acción?',
                    text: message,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#00409A',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: 'Aceptar',
                    cancelButtonText: 'Cancelar',
                    customClass: {
                        popup: 'rounded-4 border-0 shadow-lg'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        form.submit();
                    }
                });
            }
        });

        function showToast(message, type = 'danger') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container position-fixed bottom-0 end-0 p-3';
                container.style.zIndex = '1100';
                document.body.appendChild(container);
            }
            
            const toastId = 'toast-' + Date.now();
            const toastEl = document.createElement('div');
            toastEl.id = toastId;
            toastEl.className = `toast align-items-center text-white bg-${type} border-0 shadow-lg`;
            toastEl.setAttribute('role', 'alert');
            toastEl.setAttribute('aria-live', 'assertive');
            toastEl.setAttribute('aria-atomic', 'true');
            toastEl.style.borderRadius = '10px';
            
            const iconClass = type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';
            
            toastEl.innerHTML = `
                <div class="d-flex p-2">
                    <div class="toast-body d-flex align-items-center gap-2">
                        <i class="bi ${iconClass} fs-5"></i>
                        <span class="fw-semibold">${message}</span>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            `;
            
            container.appendChild(toastEl);
            
            const bsToast = new bootstrap.Toast(toastEl, { delay: 4000 });
            bsToast.show();
            
            toastEl.addEventListener('hidden.bs.toast', function() {
                toastEl.remove();
            });
        }
    </script>
</body>
</html>
